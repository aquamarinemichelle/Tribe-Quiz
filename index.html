<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ubuntu Quiz – South African Cultures</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- SCREEN 1 — HOME -->
  <div class="screen active" id="screen-home">
    <div class="home-bg-pattern"></div>
    <div class="home-content">
      <div class="home-logo">🌍</div>
      <h1 class="home-title">Ubuntu Quiz</h1>
      <p class="home-sub">Explore the rich cultures of South Africa</p>
      <div class="culture-section-label">Choose a culture to begin</div>
      <div class="culture-grid" id="culture-grid">
        <!-- This should be filled by JavaScript -->
      </div>
      <p class="footer-note">More cultures coming soon — Sepedi, Tswana, Venda &amp; more</p>
    </div>
  </div>

  <!-- SCREEN 2 — QUIZ -->
  <div class="screen" id="screen-quiz">
    <header class="quiz-header">
      <button class="back-btn" id="back-btn">&#8592; Home</button>
      <span class="culture-pill" id="quiz-culture-label">Zulu</span>
      <span class="score-display" id="live-score">0 pts</span>
    </header>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <main class="quiz-main">
      <div class="q-meta">
        <span class="q-category" id="q-category">Category</span>
        <span class="q-counter" id="q-counter">1 / 10</span>
      </div>
      <div class="question-card">
        <img class="question-image" id="question-img" src="" alt="Cultural illustration" style="display: none;" />
        <p class="q-text" id="q-text">Loading question...</p>
      </div>
      <div class="options-grid" id="options-grid"></div>
      <div class="feedback-bar" id="feedback-bar"></div>
      <button class="next-btn" id="next-btn" style="display:none;">Next question →</button>
    </main>
  </div>

  <!-- SCREEN 3 — RESULTS -->
  <div class="screen" id="screen-results">
    <div class="results-wrap">
      <div class="results-medal" id="results-medal">🏆</div>
      <h2 class="results-title" id="results-title">Excellent!</h2>
      <div class="results-score-big" id="results-score-big">8 / 10</div>
      <div class="results-pct-bar-wrap">
        <div class="results-pct-bar" id="results-pct-bar"></div>
      </div>
      <p class="results-msg" id="results-msg">Outstanding knowledge!</p>
      <div class="breakdown-card">
        <div class="breakdown-title">Question Breakdown</div>
        <div id="breakdown-list"></div>
      </div>
      <div class="results-actions">
        <button class="btn-outline" id="play-again-btn">Play again</button>
        <button class="btn-solid" id="change-culture-btn">Change culture</button>
      </div>
    </div>
  </div>

  <!-- LOAD ALL CULTURE FILES -->
  <script src="data/zulu-questions.js"></script>
  <script src="data/xhosa-questions.js"></script>
  <script src="data/sotho-questions.js"></script>
  <script src="data/sepedi-questions.js"></script>
  <script src="data/tswana-questions.js"></script>
  <script src="data/tsonga-questions.js"></script>
  <script src="data/venda-questions.js"></script>
  <script src="data/swati-questions.js"></script>
  <script src="data/ndebele-questions.js"></script>
  <script src="data/afrikaans-questions.js"></script>
  <script src="data/english-questions.js"></script>
  
  <!-- THEN LOAD MASTER QUESTIONS (combines them) -->
  <script src="data/questions.js"></script>
  
  <!-- FINALLY LOAD GAME LOGIC -->
  <script src="js/game.js"></script>
</body>
</html>
