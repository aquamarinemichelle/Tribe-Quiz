<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – Ubuntu Quiz</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body id="auth-page">

  <!-- Background (reuses homepage image) -->
  <div class="home-bg-image"></div>
  <div class="home-bg-overlay"></div>

  <!-- ── MINIMAL NAVBAR ── -->
  <nav class="navbar">
    <div class="navbar-brand">
      <img src="public/homepage/africa.png" alt="Africa" class="navbar-icon" />
      <span class="navbar-title">Ubuntu Quiz</span>
    </div>
    <a href="index.html" class="nav-link" style="margin-left:auto;">← Back to Home</a>
  </nav>

  <!-- ── AUTH CARD ── -->
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo / brand inside card -->
      <div class="auth-logo">🌍</div>
      <h1 class="auth-title">Ubuntu Quiz</h1>
      <p class="auth-subtitle">Celebrate South African Cultures</p>

      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-signin">Sign In</button>
        <button class="auth-tab" id="tab-signup">Sign Up</button>
      </div>

      <!-- Message area -->
      <div class="auth-message" id="auth-message" style="display:none;"></div>

      <!-- ── SIGN IN FORM ── -->
      <form id="form-signin" class="auth-form" autocomplete="on">
        <div class="field-group">
          <label for="signin-email">Email</label>
          <input id="signin-email" type="email" placeholder="you@example.com"
                 autocomplete="email" required />
        </div>
        <div class="field-group">
          <label for="signin-password">Password</label>
          <input id="signin-password" type="password" placeholder="••••••••"
                 autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-auth" id="btn-signin">Sign In</button>

        <div class="auth-divider"><span>or</span></div>
        <button type="button" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M43.611 20.083H42V20H24v8h11.303C33.654 32.657 29.332 35 24 35c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" fill="#FFC107"/>
            <path d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" fill="#FF3D00"/>
            <path d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0124 36c-5.315 0-9.822-3.326-11.566-7.986l-6.522 5.025C9.505 39.556 16.227 44 24 44z" fill="#4CAF50"/>
            <path d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 01-4.087 5.571l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z" fill="#1976D2"/>
          </svg>
          Continue with Google
        </button>

        <p class="auth-switch">
          Don't have an account?
          <a href="#" onclick="document.getElementById('tab-signup').click(); return false;">Sign Up</a>
        </p>
      </form>

      <!-- ── SIGN UP FORM ── -->
      <form id="form-signup" class="auth-form hidden" autocomplete="on">
        <div class="field-group">
          <label for="signup-name">Display Name</label>
          <input id="signup-name" type="text" placeholder="Your name"
                 autocomplete="name" required />
        </div>
        <div class="field-group">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" placeholder="you@example.com"
                 autocomplete="email" required />
        </div>
        <div class="field-group">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" placeholder="Min. 6 characters"
                 autocomplete="new-password" required />
        </div>
        <div class="field-group">
          <label for="signup-confirm">Confirm Password</label>
          <input id="signup-confirm" type="password" placeholder="Repeat password"
                 autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn-auth" id="btn-signup">Create Account</button>

        <div class="auth-divider"><span>or</span></div>
        <button type="button" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M43.611 20.083H42V20H24v8h11.303C33.654 32.657 29.332 35 24 35c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" fill="#FFC107"/>
            <path d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" fill="#FF3D00"/>
            <path d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0124 36c-5.315 0-9.822-3.326-11.566-7.986l-6.522 5.025C9.505 39.556 16.227 44 24 44z" fill="#4CAF50"/>
            <path d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 01-4.087 5.571l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z" fill="#1976D2"/>
          </svg>
          Continue with Google
        </button>

        <p class="auth-switch">
          Already have an account?
          <a href="#" onclick="document.getElementById('tab-signin').click(); return false;">Sign In</a>
        </p>
      </form>

    </div>
  </div>

  <!-- SUPABASE CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
